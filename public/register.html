<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Register — Nexus</title>
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<div class="container"><div class="card">
  <h1>Nexus<span>Games</span></h1>
  <p class="sub">create your account · 1000 coins starting</p>
  <label>Username</label><input id="u" autocomplete="username">
  <label>Password</label><input id="p" type="password" autocomplete="new-password">
  <button id="go">Create Account</button>
  <p class="error" id="err"></p>
  <p style="margin-top:16px;font-size:13px;color:#8a93a6">
    Have an account? <a class="link" href="/login.html">Sign in</a></p>
</div></div>
<script>
document.getElementById('go').onclick = async () => {
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    location.href = '/lobby.html';
  } catch (e) { err.textContent = e.message; }
};
</script>
</body></html>
